name: Build Aurora
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: gradle build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: Aurora
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Build launcher (Aurora embedded)
        run: |
          JAR=$(ls build/libs/aurora-*.jar | grep -v -- '-sources' | grep -v -- '-dev' | head -1)
          echo "Embedding $JAR"
          mkdir -p launcher/src/main/resources
          cp "$JAR" launcher/src/main/resources/aurora-mod.jar
          gradle -p launcher jar
      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: AuroraLauncher
          path: launcher/build/libs/AuroraLauncher.jar
